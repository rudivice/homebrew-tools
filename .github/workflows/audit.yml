name: audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    timeout-minutes: 15
    # Audit currently runs as advisory. The bookmarker formula uses the
    # git+SSH URL form (because the source repo is private) which `brew audit`
    # does not understand, and the audit job has no SSH key for the source
    # repo anyway. We re-promote to required once the source repo flips public
    # and the formula switches to the tarball+sha256 form.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when no formulae
        id: detect
        run: |
          if [ -d Formula ] && [ -n "$(find Formula -name '*.rb' -print -quit)" ]; then
            echo "has_formulae=true" >> "$GITHUB_OUTPUT"
            ls -la Formula/
          else
            echo "has_formulae=false" >> "$GITHUB_OUTPUT"
            echo "No formulae yet — skipping audit."
          fi

      - name: Mount checkout as a brew tap
        if: steps.detect.outputs.has_formulae == 'true'
        run: |
          set -euo pipefail
          TAP_ROOT="$(brew --repository)/Library/Taps/rudivice"
          mkdir -p "$TAP_ROOT"
          ln -sfn "$GITHUB_WORKSPACE" "$TAP_ROOT/homebrew-tools"
          brew tap

      - name: brew audit (advisory)
        if: steps.detect.outputs.has_formulae == 'true'
        run: |
          set +e
          for formula in Formula/*.rb; do
            name="$(basename "$formula" .rb)"
            echo "::group::brew audit $name"
            brew audit "rudivice/tools/$name" || true
            echo "::endgroup::"
          done
          exit 0
